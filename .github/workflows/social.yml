name: Social

on:
  # Disabled 2026-09-02: cron-job.org confirmed reliable over a 72h+ measurement window (286/288 ingest dispatches on spec, 3/3 daily jobs). The native schedule was firing independently (not as a dead fallback) and adding real extra executions against D1/KV free-tier caps — concurrency: cancel-in-progress: false means overlapping schedule fires queue and still run, they don't get dropped.
  # schedule:
  #   - cron: '59 7 * * *'
  workflow_dispatch:

concurrency:
  group: social-production
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RUNNER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: danielrost64/odbaveno
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Confirm ffmpeg
        run: ffmpeg -version

      - name: Run scheduled job
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing repository variable BASE_URL" >&2
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing secret INGEST_SECRET" >&2
            exit 1
          fi
          if [ -z "${PEXELS_API_KEY:-}" ]; then
            echo "Missing secret PEXELS_API_KEY" >&2
            exit 1
          fi
          npm run social
