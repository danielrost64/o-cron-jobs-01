name: Social

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: social-production
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RUNNER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: danielrost64/odbaveno
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scheduled job
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing repository variable BASE_URL" >&2
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing secret INGEST_SECRET" >&2
            exit 1
          fi
          if [ -z "${PEXELS_API_KEY:-}" ]; then
            echo "Missing secret PEXELS_API_KEY" >&2
            exit 1
          fi
          npm run social
