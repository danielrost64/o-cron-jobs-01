name: Watchdog

on:
  workflow_run:
    workflows: ['Ingest']
    types: [completed]
  # Disabled 2026-09-02: cron-job.org confirmed reliable over a 72h+ measurement window (286/288 ingest dispatches on spec, 3/3 daily jobs). The native schedule was firing independently (not as a dead fallback) and adding real extra executions against D1/KV free-tier caps — concurrency: cancel-in-progress: false means overlapping schedule fires queue and still run, they don't get dropped.
  # schedule:
  #   - cron: '59 4 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        type: choice
        options:
          - digests
          - cleanup
          - both
        default: digests

concurrency:
  group: watchdog-production
  cancel-in-progress: false

jobs:
  digests:
    name: Scheduled job
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'digests' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_RUNNER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: danielrost64/odbaveno
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare assets
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing repository variable BASE_URL" >&2
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing secret INGEST_SECRET" >&2
            exit 1
          fi
          npx tsx scripts/prepare-hlidac-deal-images.ts

      - name: Call API
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing repository variable BASE_URL" >&2
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing secret INGEST_SECRET" >&2
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/job-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "${BASE_URL}/api/watchdog")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Job failed with HTTP ${HTTP_CODE}" >&2
            exit 1
          fi

  cleanup:
    name: Daily job
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'cleanup' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_RUNNER: 'true'
    steps:
      - name: Call API
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing repository variable BASE_URL" >&2
            exit 1
          fi
          if [ -z "${INGEST_SECRET:-}" ]; then
            echo "Missing secret INGEST_SECRET" >&2
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/job-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "${BASE_URL}/api/cleanup")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Job failed with HTTP ${HTTP_CODE}" >&2
            exit 1
          fi
